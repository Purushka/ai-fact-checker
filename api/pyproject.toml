[project]
name = "factcheck"
version = "0.1.0"
description = "AI 事实核查 API 服务（OpenClaw 创业平台准确性基础设施）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "redis[hiredis]>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "celery>=5.3",
    "trafilatura>=1.8",
    "selectolax>=0.3",
    "python-dateutil>=2.8",
    "orjson>=3.10",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "tiktoken>=0.6",
]

[project.optional-dependencies]
playwright = ["playwright>=1.42"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
